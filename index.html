*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums;font:14px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji";-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{width:16px;height:16px;flex:none;display:block}
::selection{background:var(--sel)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--hov2);border-radius:10px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}

#app{display:flex;height:100%}
/* Sidebar */
#side{width:248px;flex:none;background:var(--side);display:flex;flex-direction:column;transition:margin-left .28s var(--ease-out),transform .32s var(--ease-drawer);box-shadow:inset -1px 0 0 var(--bd);user-select:none;z-index:30}
#app.side-closed #side{margin-left:-248px}
.ws{display:flex;align-items:center;gap:9px;padding:14px 10px 10px 14px}
.ws-logo{width:24px;height:24px;border-radius:7px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font:500 15px/1 var(--serif)}
.ws-name{flex:1;font:500 19px/1 var(--serif);letter-spacing:-.01em}
.ibtn{width:28px;height:28px;border-radius:var(--r-sm);transition:background-color .15s,color .15s,transform .16s var(--ease-out);display:inline-grid;place-items:center;color:var(--t2);flex:none}
.ibtn:hover{background:var(--hov2);color:var(--text)}
.sitem{display:flex;align-items:center;gap:8px;height:31px;padding:0 10px;margin:1px 8px;border-radius:var(--r-sm);color:var(--t2);font-size:14px;text-align:left;width:calc(100% - 16px)}
.sitem:hover{background:var(--hov2);color:var(--text)}
.si{width:20px;display:grid;place-items:center}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--text)}
.search input::placeholder{color:var(--t2)}
.search:focus-within{background:var(--hov2)}
.slabel{font-size:12px;font-weight:500;color:var(--t3);padding:16px 18px 6px}
#nav{flex:1;overflow:auto;padding-bottom:8px}
.nav-item{display:flex;align-items:center;gap:6px;height:31px;padding:0 4px 0 10px;margin:1px 8px;border-radius:var(--r-sm);cursor:pointer;color:var(--t2);font-size:14px}
.nav-item:hover{background:var(--hov)}
.nav-item.active{background:var(--card);color:var(--text);font-weight:500;box-shadow:var(--shadow)}
.nav-ic{width:20px;text-align:center;font-size:15px;line-height:1}
.nav-tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-del{opacity:0;width:24px;height:24px;border-radius:4px;display:grid;place-items:center;color:var(--t3)}
.nav-item:hover .nav-del{opacity:1}
.nav-del:hover{background:var(--hov2);color:var(--red)}
.nav-empty{padding:6px 16px;color:var(--t3);font-size:13px;position:relative}
.nav-item{position:relative}
.nav-item.drop-before::before,.nav-item.drop-after::after,.nav-empty.drop-after::after{content:"";position:absolute;left:10px;right:10px;height:2px;border-radius:2px;background:var(--acc);pointer-events:none;z-index:2}
.nav-item.drop-before::before{top:-2px}.nav-item.drop-after::after,.nav-empty.drop-after::after{bottom:-2px}
.nav-item.folder{color:var(--text);font-weight:500}
.chev{width:16px;height:18px;margin-left:-6px;display:grid;place-items:center;color:var(--t3);transition:transform .2s var(--ease-out);flex:none}
.chev svg{width:12px;height:12px}
.nav-item.folder.open .chev{transform:rotate(90deg)}
.f-cnt{font-size:12px;font-weight:400;color:var(--t3);min-width:18px;text-align:right;padding-right:5px}
.nav-act{display:none;width:24px;height:24px;border-radius:4px;place-items:center;color:var(--t3);flex:none}
.nav-item:hover .nav-act{display:grid}
.nav-item.folder:hover .f-cnt{display:none}
.nav-act:hover{background:var(--hov2);color:var(--text)}
.f-children{position:relative}
.f-children::before{content:"";position:absolute;left:25px;top:2px;bottom:2px;width:1px;background:var(--bd)}
.nav-item.sub{padding-left:34px}
.nav-empty.sub{padding:4px 16px 6px 40px;font-size:12px}
.nav-item.dragging,.f-children.dragging{opacity:.4}
.nav-item.drop-in{background:var(--sel);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--acc) 55%,transparent)}
#nav.drop-root{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--acc) 35%,transparent);border-radius:8px}
.rename{flex:1;min-width:0;font:inherit;font-weight:500;color:var(--text);background:var(--bg);border:0;outline:0;border-radius:4px;padding:2px 5px;box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 55%,transparent)}
.crumb-f{color:var(--t2);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.crumb-sep{color:var(--t3)}
.sfoot{padding:8px 0 12px;box-shadow:inset 0 1px 0 var(--bd)}
.scrim{display:none}

/* Main */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px}
#app:not(.side-closed) #openSide{display:none}
#crumb{display:flex;align-items:center;gap:6px;min-width:0;padding:2px 6px;font-size:14px}
#crumb span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{flex:1}
#status{font-size:12px;color:var(--t3);white-space:nowrap;margin-right:4px}
#scroll{flex:1;overflow:auto}
.page{max-width:900px;margin:0 auto;padding:0 96px}
.page.wide{max-width:none;padding:0 40px}
.page-head{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;align-items:center;padding:26px 0 18px;margin-bottom:18px;box-shadow:inset 0 -1px 0 var(--bd)}
.picon{grid-row:1/3;font-size:32px;line-height:1;width:52px;height:52px;border-radius:var(--r-md);display:grid;place-items:center;margin-left:-6px}
.picon:hover{background:var(--hov)}
.ptitle{font:500 38px/1.12 var(--serif);letter-spacing:-.015em;outline:none;margin:0;word-break:break-word;white-space:pre-wrap}
.ptitle:empty::before{content:attr(data-ph);color:var(--ph)}
.pmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;font-size:12.5px;color:var(--t3);margin-top:6px}
.pmeta .pg{display:inline-flex;align-items:center;gap:8px}
.prog{width:96px;height:6px;border-radius:3px;background:var(--hov2);overflow:hidden;display:inline-block}
.prog i{display:block;height:100%;border-radius:3px;background:var(--acc);transition:width .45s var(--ease-out)}
.empty{padding:120px 20px;text-align:center;color:var(--t2)}
.empty h2{color:var(--text);font:500 30px/1.2 var(--serif);letter-spacing:-.01em;margin:0 0 8px}
.empty .row{display:flex;gap:8px;justify-content:center;margin-top:16px}
.btn{height:34px;padding:0 14px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--bd);display:inline-flex;align-items:center;gap:6px;font-weight:500;transition:background-color .15s,transform .16s var(--ease-out)}
.btn:hover{background:var(--hov)}

/* Editor */
.editor{counter-reset:num;font-size:16px;line-height:1.5;outline:none}
.block.bsel::before{content:"";position:absolute;inset:-1px -6px;border-radius:6px;background:var(--sel);pointer-events:none;z-index:1}
.editor.bsel-mode .bc,.editor.bsel-mode{-webkit-user-select:none;user-select:none;caret-color:transparent}
.block{position:relative;display:flex;align-items:flex-start;margin:1px 0}
.block:not([data-type=number]){counter-reset:num}
.block[data-type=number]{counter-increment:num}
.grip{position:absolute;left:-26px;top:3px;width:20px;height:24px;border-radius:4px;display:grid;place-items:center;color:var(--t3);opacity:0;cursor:grab;transition:opacity .1s}
.grip svg{width:10px;height:16px}
.block:hover>.grip{opacity:1}
.grip:hover{background:var(--hov2)}
.bc{flex:1;min-width:0;outline:none;padding:3px 2px;white-space:pre-wrap;word-break:break-word}
.bc:empty::before{content:attr(data-ph);color:var(--ph);pointer-events:none}
.block[data-type=p] .bc:empty:not(:focus)::before{content:""}
.block[data-type=h1]{margin-top:1.3em}.block[data-type=h1] .bc{font:500 2em/1.2 var(--serif);letter-spacing:-.012em}.block[data-type=h1] .grip{top:11px}
.block[data-type=h2]{margin-top:1.1em}.block[data-type=h2] .bc{font:500 1.55em/1.25 var(--serif);letter-spacing:-.008em}.block[data-type=h2] .grip{top:7px}
.block[data-type=h3]{margin-top:.8em}.block[data-type=h3] .bc{font-size:1.25em;font-weight:600;line-height:1.3}.block[data-type=h3] .grip{top:4px}
.editor>.block:first-child{margin-top:0}
.pre{min-width:24px;height:30px;display:flex;align-items:center;justify-content:center;flex:none;padding:0 2px}
.block[data-type=bullet] .pre::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.block[data-type=number] .pre::before{content:counter(num) "."}
.chk{width:17px;height:17px;margin:6px 8px 0 4px;border:1.5px solid var(--t3);border-radius:5px;cursor:pointer;flex:none;display:grid;place-items:center;transition:background-color .15s,border-color .15s}
.chk svg{width:12px;height:12px;color:var(--acc-ink);opacity:0}
.chk.on{background:var(--acc);border-color:var(--acc)}.chk.on svg{opacity:1}
.block.checked .bc{text-decoration:line-through;color:var(--t3)}
.block[data-type=quote] .bc{background:var(--sage);color:var(--sage-ink);border-radius:var(--r-md);padding:14px 18px 14px 20px;margin:6px 0;font:400 1.2em/1.45 var(--serif)}
.block[data-type=code] .bc{font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--codebg);padding:16px 20px;border-radius:var(--r-md);margin:6px 0;tab-size:2}
.block[data-type=code] .grip{top:17px}
.block[data-type=divider]{padding:6px 0}
.block[data-type=image]{margin:6px 0;outline:none}
.img-box{position:relative;width:100%;max-width:100%;border-radius:10px;background:var(--hov);cursor:zoom-in;min-height:60px}
.img-rs{position:absolute;top:50%;right:5px;width:6px;height:48px;max-height:45%;transform:translateY(-50%);border-radius:4px;background:rgba(20,20,20,.62);box-shadow:0 0 0 1.5px rgba(255,255,255,.85);cursor:ew-resize;opacity:0;transition:opacity .15s;touch-action:none;z-index:2}
.img-rs::before{content:"";position:absolute;inset:-14px -12px}
.block[data-type=image]:hover .img-rs,.block[data-type=image]:focus .img-rs,.block.resizing .img-rs{opacity:1}
.block.loading .img-rs,.block.missing .img-rs{display:none}
.img-size{display:none;position:absolute;top:8px;right:8px;padding:2px 7px;border-radius:5px;background:rgba(20,20,20,.7);color:#fff;font-size:12px;pointer-events:none;z-index:2}
.block.resizing .img-size{display:block}
.block.resizing{user-select:none}
.block.ready .img-box{background:none;min-height:0}
.img-box img{display:block;width:100%;height:auto;border-radius:10px}
.block.loading .img-box img,.block.missing .img-box img{display:none}
.img-msg{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:10px;text-align:center;font-size:13px;color:var(--t3)}
.block.loading .img-msg,.block.missing .img-msg{display:flex}
.block.loading .img-box{animation:pulse 1.2s infinite}
.block[data-type=image]:focus .img-box{box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 55%,transparent)}
.block[data-type=image] .grip{top:4px}
.editor.drop-files{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--acc) 35%,transparent);border-radius:8px}
.lightbox{position:fixed;inset:0;z-index:95;background:rgba(10,10,10,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px 16px calc(16px + env(safe-area-inset-bottom))}
.lightbox img{max-width:100%;max-height:calc(100% - 64px);object-fit:contain;border-radius:6px;cursor:zoom-out}
.lb-bar{display:flex;gap:8px}
.lb-bar button{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;font-size:14px}
.lb-bar button:hover{background:rgba(255,255,255,.2)}
.lb-bar button.danger:hover{background:rgba(235,87,87,.5)}
.block[data-type=divider] .grip{top:1px}
.hr{flex:1;height:1px;background:var(--bd);margin:6px 0}
.bc code{background:var(--icode);color:var(--icodec);border-radius:4px;padding:.15em .35em;font:85% ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bc mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.bc a[href],.ttext a[href]{color:var(--link);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--link) 45%,transparent);text-underline-offset:3px;cursor:pointer;word-break:break-all}
.bc a[href]:hover,.ttext a[href]:hover{text-decoration-color:var(--link)}
.lp{display:flex;flex-direction:column;padding:4px;font-size:13px;max-width:calc(100vw - 16px)}
.lp-view{display:flex;align-items:center;gap:2px}
.lp-url{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-radius:6px;color:var(--t2);text-decoration:none;min-width:0;max-width:240px}
.lp-url span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-url:hover{background:var(--hov2);color:var(--text)}
.lp .sep{width:1px;height:18px;background:var(--bd);margin:0 3px;flex:none}
.lp-btn{display:flex;align-items:center;gap:5px;height:30px;padding:0 8px;border-radius:6px;white-space:nowrap}
.lp-btn svg{width:15px;height:15px}
.lp-btn:hover{background:var(--hov2)}
.lp-btn.danger:hover{color:var(--red)}
.lp-edit{display:none;flex-direction:column;gap:10px;padding:10px;width:340px;max-width:calc(100vw - 24px)}
.lp.editing .lp-view{display:none}.lp.editing .lp-edit{display:flex}
.lp-edit label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--t2)}
.lp-edit input{height:36px;border:0;border-radius:10px;padding:0 10px;font:inherit;font-size:14px;color:var(--text);background:var(--hov);box-shadow:inset 0 0 0 1px var(--bd);outline:0}
.lp-edit input:focus{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--acc) 60%,transparent)}
.lp-row{display:flex;justify-content:flex-end;gap:6px}
.btn.primary{background:var(--acc);color:var(--acc-ink);box-shadow:none;border-radius:999px;padding:0 18px}.btn.primary:hover{background:var(--acc-h)}
.block.dragging{opacity:.35}
.block.drop-before::after,.block.drop-after::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--acc);opacity:.6;border-radius:2px}
.block.drop-before::after{top:-2px}.block.drop-after::after{bottom:-2px}
.ed-tail{height:30vh;cursor:text}

/* Board */
.board{display:flex;gap:16px;align-items:flex-start;overflow-x:auto;padding:4px 2px 16px}
.col{flex:1 1 0;min-width:270px;max-width:420px;border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;max-height:var(--colmax,calc(100vh - 120px))}
.col-head{flex:none}
.col-backlog{background:var(--c-backlog)}.col-todo{background:var(--c-todo)}.col-done{background:var(--c-done)}
.col-head{display:flex;align-items:center;gap:8px;padding:2px 2px 10px 4px;min-height:36px}
.pill{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px 0 10px;border-radius:999px;font-size:13.5px;font-weight:500}
.pill i{width:8px;height:8px;border-radius:50%}
.col-backlog .pill{background:var(--p-backlog);color:var(--x-backlog)}.col-backlog .pill i{background:var(--d-backlog)}
.col-todo .pill{background:var(--p-todo);color:var(--x-todo)}.col-todo .pill i{background:var(--d-todo)}
.col-done .pill{background:var(--p-done);color:var(--x-done)}.col-done .pill i{background:var(--d-done)}
.cnt{color:var(--t3);font-size:14px}
.col-head .ibtn{opacity:.0;width:26px;height:26px}
.col:hover .col-head .ibtn{opacity:1}
.cards{display:flex;flex-direction:column;gap:8px;min-height:6px;flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;margin:0 -6px;padding:2px 6px 4px;scrollbar-width:thin}
.cards>*{flex:none}
.cards.fade-b{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent)}
.cards.fade-t{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 28px);mask-image:linear-gradient(to bottom,transparent,#000 28px)}
.cards.fade-t.fade-b{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 28px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to bottom,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
.card{position:relative;background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow);padding:12px 8px 10px 12px;display:grid;grid-template-columns:auto 1fr auto;column-gap:10px;align-items:start;cursor:grab;transition:opacity .22s var(--ease-out),transform .22s var(--ease-out),background-color .15s}
.card:hover{background:var(--cardh)}
.card.dragging{opacity:.35}
.card.leaving{opacity:0;transform:translateX(12px) scale(.97)}
.card.ghost{box-shadow:var(--lift);cursor:default}
.lightbox{animation:fade-in .2s var(--ease-out)}
.lightbox img{animation:dlg-in .26s var(--ease-out)}
.card.flash{animation:flash 1.4s var(--ease-out)}
@keyframes flash{0%,35%{box-shadow:0 0 0 2px var(--acc),var(--shadow)}100%{box-shadow:var(--shadow)}}
.tchk{width:18px;height:18px;margin-top:1px;border:1.5px solid var(--t3);border-radius:50%;display:grid;place-items:center;transition:background-color .18s var(--ease-out),border-color .18s,transform .16s var(--ease-out)}
.tchk svg{width:11px;height:11px;color:var(--acc-ink);opacity:0;transition:opacity .15s}
.tchk:hover{border-color:var(--acc)}
.tchk.on{background:var(--acc);border-color:var(--acc)}.tchk.on svg{opacity:1}
.ttext{font-size:14px;line-height:1.5;font-weight:500;outline:none;cursor:text;word-break:break-word;white-space:pre-wrap;min-height:21px}
.ttext:empty::before{content:attr(data-ph);color:var(--ph);font-weight:400}
.card.is-done .ttext{text-decoration:line-through;color:var(--t3)}
.tdel{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;color:var(--t3);opacity:0}
.tdel svg{width:14px;height:14px}
.card:hover .tdel{opacity:1}
.tdel:hover{background:var(--hov2);color:var(--red)}
.tmeta{grid-column:2/4;display:flex;align-items:center;gap:5px;margin-top:5px;font-size:12px;color:var(--t3);cursor:pointer;width:fit-content;border-radius:4px;padding:1px 4px 1px 0}
.tmeta svg{width:13px;height:13px}
.tmeta:hover{color:var(--t2)}
.thist{grid-column:2/4;display:none;margin-top:6px;padding-top:6px;box-shadow:inset 0 1px 0 var(--bd);font-size:12px;color:var(--t2)}
.card.show-hist .thist{display:block}
.thist div{display:flex;justify-content:space-between;gap:10px;padding:1px 0}
.thist span{color:var(--t3);white-space:nowrap}
.add-card{flex:none;display:flex;align-items:center;gap:6px;width:100%;height:34px;padding:0 8px;margin-top:6px;border-radius:var(--r-sm);color:var(--t3);font-size:14px}
.add-card:hover{background:var(--hov2);color:var(--t2)}
.drop-line{height:2px;margin:-5px 2px;background:var(--acc);border-radius:2px;opacity:.7}

/* Popovers */
.pop{position:fixed;z-index:50;background:var(--pop);box-shadow:var(--popsh);border-radius:var(--r-md)}
.menu:not([hidden]){animation:pop-in .14s var(--ease-out)}
@keyframes pop-in{from{opacity:0;transform:scale(.97)}}
.menu{padding:6px;min-width:220px;max-width:320px;max-height:360px;overflow:auto;font-size:14px}
.mi{display:flex;align-items:center;gap:10px;padding:4px 8px;min-height:32px;border-radius:var(--r-sm);cursor:pointer}
.mi.on{background:var(--hov2)}
.mi.danger{color:var(--red)}
.mi-ic{width:20px;display:grid;place-items:center;flex:none;color:var(--t2);font-size:13px}
.mi.danger .mi-ic{color:var(--red)}
.mi-tx{display:flex;flex-direction:column;min-width:0}
.mi-tx small{color:var(--t3);font-size:12px}
.menu.big .mi-ic{width:40px;height:40px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--bd);background:var(--bg);font-weight:600;font-size:15px;color:var(--text)}
.mi-head{padding:8px 8px 4px;font-size:12px;font-weight:500;color:var(--t3)}
.mi-empty{padding:8px;color:var(--t3)}
.emo{display:grid;grid-template-columns:repeat(8,34px);gap:2px;padding:8px}
.emo button{height:34px;border-radius:6px;font-size:20px}
.emo button:hover{background:var(--hov2)}
.fmt{display:flex;align-items:center;padding:4px;border-radius:10px}
.fmt button{height:28px;min-width:30px;padding:0 7px;border-radius:6px;display:grid;place-items:center;font-size:14px}
.fmt button:hover{background:var(--hov2)}
.fmt .sep{width:1px;height:18px;background:var(--bd);margin:0 3px}
.fmt .hl{background:var(--mark);padding:0 3px;border-radius:3px}

/* sync pill */
.sync{display:none;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:12px;color:var(--t2);white-space:nowrap}
.sync:hover{background:var(--hov2)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--t3);flex:none}
.sync.on{display:inline-flex}
.sync.ok i{background:var(--ok)}.sync.busy i{background:var(--acc);animation:pulse 1s infinite}.sync.warn i{background:var(--warn)}.sync.err i{background:var(--red)}.sync.err{color:var(--red)}
@keyframes pulse{50%{opacity:.3}}
/* overlay dialog */
.ovl{position:fixed;inset:0;z-index:80;background:rgba(20,26,21,.42);display:grid;place-items:center;padding:20px;animation:fade-in .18s var(--ease-out)}
@keyframes fade-in{from{opacity:0}}
.ovl .dlg{animation:dlg-in .22s var(--ease-out)}
@keyframes dlg-in{from{opacity:0;transform:scale(.96) translateY(6px)}}
.dlg{background:var(--pop);color:var(--text);box-shadow:var(--popsh);border-radius:22px;width:100%;max-width:420px;padding:26px 24px 20px}
.dlg h3{margin:0 0 6px;font:500 25px/1.2 var(--serif);letter-spacing:-.01em}
.dlg p{margin:6px 0;color:var(--t2);font-size:14px}
.dlg .ic{font-size:34px;line-height:1;margin-bottom:10px}
.dlg .fld{display:flex;flex-direction:column;gap:5px;margin-top:14px;font-size:13px;color:var(--t2)}
.dlg .fld span{display:flex;justify-content:space-between;align-items:baseline}
.dlg .fld a{color:var(--acc);text-decoration:none;font-weight:500}
.dlg input{width:100%;height:44px;border:0;border-radius:12px;padding:0 12px;font:15px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);background:var(--hov);box-shadow:inset 0 0 0 1px var(--bd);outline:0}
.dlg .hint{font-size:12.5px;margin-top:12px}
.dlg .warn-msg{color:var(--warn);font-size:13.5px}
.dlg .btn:disabled{opacity:.55;pointer-events:none}
.sync.off{color:var(--acc);font-weight:500;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 40%,transparent)}.sync.off i{display:none}
.dlg input:focus{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--acc) 60%,transparent)}
.dlg .err{color:var(--red);min-height:20px;font-size:13px}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.dlg .btn{height:40px;padding:0 16px}
.dlg .btn.primary{padding:0 20px}
.dlg ol{margin:8px 0;padding-left:20px;color:var(--t2);font-size:14px}.dlg li{margin:5px 0}
.share-ic{display:inline-block;vertical-align:-3px}
/* toast */

async function connect(token, pass, progress) {
  if (!window.crypto || !crypto.subtle) throw new Error('Trình duyệt này không hỗ trợ mã hóa. Hãy dùng Chrome hoặc Safari bản mới.');
  const old = { ...SM };
  SM.token = token;
  try {
    let r = await gh('GET', '/user');
    if (r.status === 401) throw new Error('Token không đúng hoặc đã hết hạn.');
    if (!r.ok) throw new Error('GitHub trả về lỗi ' + r.status + '. Thử lại sau.');

    SM.login = (await r.json()).login || '';

    let found = null;

      const lr = await gh('GET', `/gists?per_page=100&page=${page}`);
      if (!lr.ok) throw new Error('Không đọc được danh sách Gist (' + lr.status + '). Token cần quyền gist.');
      const list = await lr.json();
      found = list.filter(g => g.files && g.files[GIST_FILE]).sort((a, b) => (b.updated_at > a.updated_at ? 1 : -1))[0] || null;
      if (list.length < 100) break;
    }
    if (found) {
      progress('Đang giải mã…');
      const gr = await gh('GET', '/gists/' + found.id); checkResp(gr);
      const gj = await gr.json(), env = JSON.parse(await fileText(gj));
      const key = await deriveKey(pass, env.salt, env.iter);
      try { await unseal(JSON.stringify(env), key); }
      catch (_) { throw new Error('Sai mật khẩu đồng bộ. Dữ liệu trên GitHub đã được mã hóa bằng mật khẩu khác (mật khẩu bạn đặt lần đầu).'); }
      CK = key;
      Object.assign(SM, { gist: found.id, salt: env.salt, iter: env.iter, key: b64(await crypto.subtle.exportKey('raw', key)), ver: '', etag: '', base: {}, last: 0, skipSetup: false });
      saveSM(); haveRemote = false; pending = true; lastWriteAt = 0;
      progress('Đang gộp dữ liệu…');
      await syncNow(true);
      if (syncState !== 'ok') throw new Error('Kết nối được nhưng chưa đồng bộ xong. Kiểm tra mạng rồi bấm lại.');
      toast('Đã bật đồng bộ ✓ Dữ liệu từ các máy khác đã được gộp vào.');
    } else {
      progress('Đang tạo nơi lưu trữ mã hóa trên GitHub…');
      const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
      CK = await deriveKey(pass, salt, KDF_ITER);
      Object.assign(SM, { salt, iter: KDF_ITER, key: b64(await crypto.subtle.exportKey('raw', CK)) });
      const cr = await gh('POST', '/gists', { description: GIST_DESC, public: false, files: { [GIST_FILE]: { content: await seal(docOf(S)) } } });
      if (!cr.ok) throw new Error('Không tạo được Gist (' + cr.status + '). Token cần quyền gist.');
      const cj = await cr.json();
      Object.assign(SM, { gist: cj.id, skipSetup: false });
      finishSync(verOf(cj), '', docOf(S));
      toast('Đã bật đồng bộ ✓ Mở NoteLite trên điện thoại và nhập cùng token + mật khẩu.');

/* ---------- Images in notes ----------
   Pixels never go into the note data (browser storage is small and the note file is re-uploaded on every sync).
   • On this device: compressed image in IndexedDB, key = image id.  Note block = { type:'image', img:id }.
   • Sync: each image is encrypted with the same key as the notes and stored once in its own secret Gist;
     S.imgs[id] = { w, h, g: gistId } travels with the notes. Other devices download an image only when it's shown. */
const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('notelite', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('img');
    r.onsuccess = () => res(r.result);
    r.onerror = () => { dbp = null; rej(r.error); };
  }));
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction('img', mode), rq = fn(tx.objectStore('img'));
      tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  };
  return { get: k => run('readonly', s => s.get(k)), put: (k, v) => run('readwrite', s => s.put(v, k)) };
})();
const IMG_MAX = 2000;                                   // longest side after resize (sharp enough for screenshots)
const IMGURL = new Map(), IMGLOAD = new Map();
let persistAsked = false;

async function decodeImage(file) {
  if (window.createImageBitmap) { try { return await createImageBitmap(file); } catch (_) {} }
  const u = URL.createObjectURL(file), im = new Image();
  im.src = u;
  try { await im.decode(); } finally { setTimeout(() => URL.revokeObjectURL(u), 2000); }
  return im;
}
/* resize + compress: WebP where the browser can make it, else JPEG; keeps small originals (and GIF animations) untouched */
async function prepImage(file) {
  const src = await decodeImage(file);
  const w0 = src.width || src.naturalWidth, h0 = src.height || src.naturalHeight;
  if (!w0 || !h0) throw new Error('decode');
  if (file.type === 'image/gif' && file.size <= 3e6) return { blob: file, w: w0, h: h0 };
  const k = Math.min(1, IMG_MAX / Math.max(w0, h0)), W = Math.max(1, Math.round(w0 * k)), H = Math.max(1, Math.round(h0 * k));
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(src, 0, 0, W, H);
  if (src.close) src.close();
  const toBlob = (t, q) => new Promise(r => cv.toBlob(r, t, q));
  let out = await toBlob('image/webp', 0.86);
  if (!out || out.type !== 'image/webp') {
    g.globalCompositeOperation = 'destination-over'; g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);   // JPEG has no transparency
    out = await toBlob('image/jpeg', 0.86);
  }
  if (!out || (k === 1 && file.size <= out.size && file.size < 1.5e6 && /^image\/(png|jpeg|webp)$/.test(file.type))) out = file;
  return { blob: out, w: W, h: H };
}
function usedImgIds() {            // images still placed in some note (deleted ones are not uploaded / exported)
  const u = new Set();
  Object.values(S.pages).forEach(p => (p.type === 'note' ? p.blocks || [] : []).forEach(b => { if (b.type === 'image' && b.img) u.add(b.img); }));
  return u;
}
function imgMeta(id) { return (S.imgs && S.imgs[id]) || null; }
async function imageUrl(id) {
  if (IMGURL.has(id)) return IMGURL.get(id);
  if (IMGLOAD.has(id)) return IMGLOAD.get(id);
  const p = (async () => {
    let rec = await IDB.get(id).catch(() => null);
    if (!rec) rec = await downloadImage(id);
    const url = URL.createObjectURL(new Blob([rec.buf], { type: rec.type }));
    IMGURL.set(id, url);
    return url;
  })();
  IMGLOAD.set(id, p);
  try { return await p; } finally { IMGLOAD.delete(id); }
}
async function downloadImage(id) {
  const m = imgMeta(id);
  if (!m || !m.g) throw new Error('pending');                   // not uploaded yet by the device that has it
  if (!configured() || !CK) throw new Error('nosync');
  const r = await gh('GET', '/gists/' + m.g);
  if (!r.ok) throw new Error('http ' + r.status);
  const j = await r.json(), f = Object.values(j.files || {})[0];
  if (!f) throw new Error('empty');
  const text = f.truncated ? await (await fetch(f.raw_url, { cache: 'no-store' })).text() : f.content;
  const e = JSON.parse(text);
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(e.iv) }, CK, unb64(e.ct));
  const rec = { buf, type: e.type || 'image/jpeg', w: m.w, h: m.h };
  await IDB.put(id, rec).catch(() => {});
  return rec;
}
async function sealImage(rec) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, CK, rec.buf);
  return JSON.stringify({ app: 'NoteLite', kind: 'image', v: 1, note: 'Ảnh NoteLite đã mã hóa (AES-256-GCM).', type: rec.type, iv: b64(iv), ct: b64(ct) });
}
let pumping = false;
async function pumpImages() {                                   // upload images that exist only on this device
  if (pumping || !configured() || !CK || !S.imgs) return;
  const used = usedImgIds(), todo = Object.keys(S.imgs).filter(id => !S.imgs[id].g && used.has(id));
  if (!todo.length) return;
  pumping = true;
  try {
    for (const id of todo) {
      const rec = await IDB.get(id).catch(() => null);
      if (!rec) continue;
      const r = await gh('POST', '/gists', { description: 'NoteLite · ảnh (đã mã hóa)', public: false, files: { 'notelite-image.enc.json': { content: await sealImage(rec) } } });
      if (!r.ok) break;
      const j = await r.json();
      S.imgs[id] = { ...S.imgs[id], g: j.id };
      save();
    }
  } catch (_) { /* offline: try again after the next sync */ }
  finally { pumping = false; }
}
function mergeImgs(a, b) {
  if (!a && !b) return undefined;
  const r = { ...(a || {}) };
  for (const k in (b || {})) if (!r[k] || (!r[k].g && b[k].g)) r[k] = b[k];
  return r;
}

/* ---- image block in the editor ---- */

  wrap.append(q);
  /* unfinished tasks from the last day that had a list */
  const old = S.today && S.today.date !== dayKey() ? todayItems(S.today).filter(x => x.t.col !== 'done' && !already.has(tkey(x.it))) : [];
  if (old.length) {
    const carry = h('button', 'pk-carry', `${IC.sync}<span>Chọn lại <b>${old.length}</b> việc chưa xong từ ${dayLabel(S.today.date)}</span>`);
    carry.onclick = () => { old.forEach(x => sel.set(tkey(x.it), x.it)); carry.remove(); draw(); };
    wrap.append(carry);
  }
  const list = h('div', 'pk-list');
  const foot = h('div', 'pk-foot');
  const cnt = h('span', 'pk-cnt');
  const go = h('button', 'btn primary', esc(cta));
  if (onCancel) { const c = h('button', 'btn', 'Hủy'); c.onclick = onCancel; foot.append(cnt, c, go); } else foot.append(cnt, go);
  wrap.append(list, foot);
  function draw() {
    list.innerHTML = '';
    const qq = norm(q.value.trim());
    let shown = 0;
    boardsInOrder().forEach(p => {
      const tasks = [...p.tasks.filter(t => t.col === 'todo'), ...p.tasks.filter(t => t.col === 'backlog')]
        .filter(t => t.text.trim() && !already.has(p.id + '/' + t.id) && (!qq || norm(t.text + ' ' + p.title).includes(qq)));
      if (!tasks.length) return;
      const g = h('div', 'pk-g', `<span>${esc(p.icon || '✅')}</span><span class="nm">${esc(p.title || 'Không có tiêu đề')}</span><span class="n">${tasks.length}</span>`);
      list.append(g);
      tasks.forEach(t => {
        const k = p.id + '/' + t.id, on = sel.has(k);
        const row = h('button', 'pk-row' + (on ? ' on' : ''), `<span class="tchk${on ? ' on' : ''}">${IC.check}</span><span class="pk-tx">${esc(t.text)}</span><span class="cl cl-${t.col}">${colName(t.col)}</span>`);
        row.onclick = () => {
          if (sel.has(k)) sel.delete(k); else sel.set(k, { p: p.id, t: t.id });
          const now_ = sel.has(k); row.classList.toggle('on', now_); $('.tchk', row).classList.toggle('on', now_); count();
        };
        list.append(row); shown++;
      });
    });
    if (!shown) list.append(h('div', 'pk-empty', qq ? 'Không có task nào khớp.' : 'Chưa có task nào đang chờ trong các todo list (Backlog / To-do).'));
    count();
  }
  function count() { cnt.textContent = sel.size ? `Đã chọn ${sel.size}` : 'Chưa chọn việc nào'; go.disabled = !sel.size; }
  q.addEventListener('input', draw);
  go.onclick = () => { const td2 = todayList(); onDone([...(td2 ? td2.items : []), ...sel.values()]); };
  draw();
  return wrap;
}
function openPickerModal() {
  const d = dialog('<h3>Thêm việc cho hôm nay</h3>');
  d.classList.add('dlg-picker');
  d.append(buildPicker(items => {
    const had = new Set((todayList() || { items: [] }).items.map(tkey));
    closeOvl(); setToday(items); todayRefresh({ enter: k => !had.has(k) });
  }, 'Thêm vào hôm nay', closeOvl));
  d.addEventListener('keydown', e => { if (e.key === 'Escape') closeOvl(); });
  setTimeout(() => { const q = $('.pk-q', d); if (q && matchMedia('(pointer:fine)').matches) q.focus(); }, 50);
}

/* ---------- Shell events ---------- */
function applyTheme() {
  const t = S.theme || 'auto';
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t;
  $('#themeLbl').textContent = { auto: 'Tự động', light: 'Sáng', dark: 'Tối' }[t];
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  $$('meta[name=theme-color]').forEach(m => { if (t === 'auto') m.content = m.media.includes('dark') ? '#131814' : '#f5f2ea'; else m.content = bg; });
}
$('#themeBtn').onclick = () => { S.theme = { auto: 'light', light: 'dark', dark: 'auto' }[S.theme || 'auto']; applyTheme(); save(); };
let sideOpen = true;
function setSide(v) { sideOpen = v; $('#app').classList.toggle('side-closed', !v); if (innerWidth > 760) { S.side = v; save(); } }
$('#closeSide').onclick = () => setSide(false);
$('#openSide').onclick = () => setSide(true);
$('#scrim').onclick = () => setSide(false);
$('#newNote').onclick = () => createPage('note');
$('#newBoard').onclick = () => createPage('board');
$('#newFolder').onclick = () => createFolder();
$('#todayNav').onclick = () => { if (S.active !== TODAY) openToday(); else if (innerWidth <= 760) setSide(false); };
setInterval(() => { if (dayKey() !== shownDay) { shownDay = dayKey(); updateTodayNav(); if (S.active === TODAY) renderPage(); } }, 30000);   // midnight → new day
$('#q').addEventListener('input', () => { NAV_QUIET = true; renderNav(); });
const NAV = $('#nav');
NAV.addEventListener('click', e => {
  if (e.target.closest('input')) return;
  const fr = e.target.closest('.nav-item.folder');
  if (fr) {
    const fid = fr.dataset.fid, act = e.target.closest('.nav-act');
    if (act) {
      e.stopPropagation();
      const r = act.getBoundingClientRect();
      if (act.dataset.act === 'add') openMenu(r, [{ label: 'Ghi chú mới', ic: IC.doc, t: 'note' }, { label: 'Todo list mới', ic: IC.board, t: 'board' }], it => createPage(it.t, fid), 'folder');
      else openMenu(r, [
        { label: 'Đổi tên', ic: IC.edit, a: 'ren' },
        { label: 'Di chuyển lên', ic: IC.mvUp, a: 'up' },
        { label: 'Di chuyển xuống', ic: IC.mvDown, a: 'down' },
        { label: 'Ghi chú mới trong thư mục', ic: IC.doc, a: 'note' },
        { label: 'Todo list mới trong thư mục', ic: IC.board, a: 'board' },
        { label: 'Xóa thư mục', ic: IC.trash, a: 'del', cls: 'danger' }
      ], it => { if (it.a === 'ren') startRename(fid); else if (it.a === 'del') deleteFolder(fid); else if (it.a === 'up' || it.a === 'down') stepFolder(fid, it.a === 'up' ? -1 : 1); else createPage(it.a, fid); }, 'folder');
      return;
    }
    const f = S.folders[fid], box = $(`.f-children[data-fid="${fid}"]`, NAV), chev = $('.chev', fr);
    if (fr.dataset.anim) return;
    const spin = open => !motionOff() && chev.animate([{ transform: `rotate(${open ? 0 : 90}deg)` }, { transform: `rotate(${open ? 90 : 0}deg)` }], { duration: 220, easing: EASE });
    if (f.open && box && !$('#q').value.trim()) {        // close: shrink the contents, then redraw without them
      fr.dataset.anim = '1'; f.open = false; save(); spin(false);
      heightAnim(box, false, () => { NAV_QUIET = true; renderNav(); });
    } else {
      f.open = !f.open; save(); NAV_QUIET = true; renderNav();
      if (f.open) { heightAnim($(`.f-children[data-fid="${fid}"]`, NAV), true); spin(true); }
    }
    return;
  }
  const del = e.target.closest('.nav-del'), it = e.target.closest('.nav-item[data-id]');
  if (!it) return;
  if (del) { e.stopPropagation(); deletePage(it.dataset.id); return; }
  if (it.dataset.id !== S.active) openPage(it.dataset.id);
  else if (innerWidth <= 760) setSide(false);
});
NAV.addEventListener('dblclick', e => {
  const fr = e.target.closest('.nav-item.folder');
  if (fr && !e.target.closest('.nav-act,input')) startRename(fr.dataset.fid);
});
/* sidebar drag & drop: reorder pages and folders, move pages between folders */
let DRAGP = null, DRAGF = null, NAVDROP = null;
function clearNavDrop() { $$('.drop-in,.drop-before,.drop-after', NAV).forEach(x => x.classList.remove('drop-in', 'drop-before', 'drop-after')); NAV.classList.remove('drop-root'); }
const folderRowEl = fid => $(`.nav-item.folder[data-fid="${fid}"]`, NAV);
function folderTail(fid) {                     // last visible row of a folder block (for an "after" line)
  const box = $(`.f-children[data-fid="${fid}"]`, NAV);
  return (box && box.lastElementChild) || folderRowEl(fid);
}
function navDropAt(e) {
  const el = e.target.nodeType === 1 ? e.target : e.target.parentElement;
  const row = el && el.closest('.nav-item, .nav-empty');
  if (DRAGF) {
    const blk = el && el.closest('.nav-item.folder, .f-children');
    if (blk) {
      const fid = blk.dataset.fid, fr = folderRowEl(fid), r = fr.getBoundingClientRect();
      const before = blk === fr && e.clientY < r.top + r.height / 2;
      return { kind: 'folder', fid, before, el: before ? fr : folderTail(fid) };
    }
    const last = S.folderOrder[S.folderOrder.length - 1];
    return last ? { kind: 'folder', fid: last, before: false, el: folderTail(last) } : null;
  }
  if (!DRAGP) return null;
  if (row && row.dataset.id) {
    const r = row.getBoundingClientRect(), before = e.clientY < r.top + r.height / 2;
    return { kind: 'page', ref: row.dataset.id, fid: S.pages[row.dataset.id].folder || null, before, el: row };
  }
  if (row && row.classList.contains('folder')) return { kind: 'into', fid: row.dataset.fid, el: row };
  const box = el && el.closest('.f-children');
  if (box) return { kind: 'into', fid: box.dataset.fid, el: folderRowEl(box.dataset.fid) };
  return { kind: 'root' };
}
NAV.addEventListener('dragstart', e => {
  const it = e.target.nodeType === 1 && e.target.closest('.nav-item'); if (!it) return;
  if (it.dataset.id) DRAGP = it.dataset.id;
  else if (it.dataset.fid && it.classList.contains('folder')) DRAGF = it.dataset.fid;
  else return;
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', '');
  requestAnimationFrame(() => {
    it.classList.add('dragging');
    if (DRAGF) { const box = $(`.f-children[data-fid="${DRAGF}"]`, NAV); box && box.classList.add('dragging'); }
  });
});
NAV.addEventListener('dragover', e => {
  if (!DRAGP && !DRAGF) return;
  e.preventDefault(); clearNavDrop();
  const d = NAVDROP = navDropAt(e);
  if (!d) return;
  if (d.kind === 'into') d.el.classList.add('drop-in');
  else if (d.kind === 'root') NAV.classList.add('drop-root');
  else if (d.el && !(d.kind === 'page' && d.ref === DRAGP) && !(d.kind === 'folder' && d.fid === DRAGF)) d.el.classList.add(d.before ? 'drop-before' : 'drop-after');
});
NAV.addEventListener('dragleave', e => { if (!NAV.contains(e.relatedTarget)) { clearNavDrop(); NAVDROP = null; } });
NAV.addEventListener('drop', e => {
  if (!DRAGP && !DRAGF) return;
  e.preventDefault();
  const d = navDropAt(e), pid = DRAGP, fid = DRAGF;
  DRAGP = DRAGF = NAVDROP = null; clearNavDrop();
  if (!d) { renderNav(); return; }
  NAV_SKIP = pid || ('f:' + fid);                 // the dropped row lands where it was dropped; the others make room
  if (fid) placeFolder(fid, d.fid, d.before);
  else if (d.kind === 'page') placePage(pid, d.fid, d.ref, d.before);
  else if (d.kind === 'into') placePage(pid, d.fid, null);
  else placePage(pid, null, null);
});
NAV.addEventListener('dragend', () => { DRAGP = DRAGF = NAVDROP = null; clearNavDrop(); $$('.dragging', NAV).forEach(x => x.classList.remove('dragging')); });
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key === '\\') { e.preventDefault(); setSide(!sideOpen); }
  else if (mod && (e.key === 's' || e.key === 'S')) { e.preventDefault(); dirty = true; saveNow(); }
});
window.addEventListener('beforeunload', saveNow);
['dragover', 'drop'].forEach(ev => window.addEventListener(ev, e => { if (e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files') && !e.defaultPrevented) e.preventDefault(); }));
let fitT = null;
window.addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(fitBoard, 100); });
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
window.addEventListener('storage', e => {
  if (e.key !== KEY || !e.newValue) return;
  try { const a = S.active; S = fix(JSON.parse(e.newValue)); if (S.pages[a]) S.active = a; render(); } catch (_) {}
});

/* ---------- Init ---------- */
load();
sideOpen = innerWidth > 760 ? S.side !== false : false;
$('#app').classList.toggle('side-closed', !sideOpen);
render();
setStatus('Đã lưu');
initSync();
})();
</script>

<!DOCTYPE html>

<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<title>NoteLite</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23191919'/%3E%3Cpath d='M19 47V17h6.2l13.6 19.4V17H45v30h-6.1L25.2 27.6V47z' fill='%23f4f3ef'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#fff;--side:#f8f8f7;--text:#37352f;--t2:rgba(55,53,47,.65);--t3:rgba(55,53,47,.42);--ph:rgba(55,53,47,.22);
  --hov:rgba(55,53,47,.06);--hov2:rgba(55,53,47,.1);--bd:rgba(55,53,47,.09);--acc:#2383e2;--red:#eb5757;--link:#1f7ad6;
  --card:#fff;--cardh:#fbfbfa;--shadow:rgba(15,15,15,.07) 0 0 0 1px,rgba(15,15,15,.06) 0 2px 4px;
  --pop:#fff;--popsh:rgba(15,15,15,.05) 0 0 0 1px,rgba(15,15,15,.1) 0 3px 6px,rgba(15,15,15,.2) 0 9px 24px;
  --codebg:#f7f6f3;--icode:rgba(135,131,120,.15);--icodec:#eb5757;--mark:rgba(255,212,0,.38);
  --c-backlog:#f7f7f5;--p-backlog:rgba(227,226,224,.75);--d-backlog:#91918e;--x-backlog:#32302c;
  --c-todo:#f4f8fb;--p-todo:#d3e5ef;--d-todo:#5b97bd;--x-todo:#183347;
  --c-done:#f5f9f6;--p-done:#dbeddb;--d-done:#6c9b7d;--x-done:#1c3829;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#191919;--side:#202020;--text:rgba(255,255,255,.86);--t2:rgba(255,255,255,.56);--t3:rgba(255,255,255,.36);--ph:rgba(255,255,255,.2);
  --hov:rgba(255,255,255,.055);--hov2:rgba(255,255,255,.09);--bd:rgba(255,255,255,.09);
  --card:#252525;--cardh:#2b2b2b;--shadow:rgba(255,255,255,.07) 0 0 0 1px,rgba(0,0,0,.3) 0 2px 4px;
  --pop:#252525;--popsh:rgba(255,255,255,.08) 0 0 0 1px,rgba(0,0,0,.35) 0 3px 6px,rgba(0,0,0,.45) 0 9px 24px;
  --codebg:#222;--icode:rgba(135,131,120,.25);--icodec:#ff7369;--mark:rgba(255,212,0,.24);
  --c-backlog:#1e1e1e;--p-backlog:#373737;--d-backlog:#979a9b;--x-backlog:rgba(255,255,255,.86);
  --c-todo:#1a1f25;--p-todo:#1f3a52;--d-todo:#5e9fd0;--x-todo:#d3e6f5;--link:#5aa6e0;
  --c-done:#1a211c;--p-done:#243b2c;--d-done:#6aa37f;--x-done:#d0e8d7;
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#191919;--side:#202020;--text:rgba(255,255,255,.86);--t2:rgba(255,255,255,.56);--t3:rgba(255,255,255,.36);--ph:rgba(255,255,255,.2);
  --hov:rgba(255,255,255,.055);--hov2:rgba(255,255,255,.09);--bd:rgba(255,255,255,.09);
  --card:#252525;--cardh:#2b2b2b;--shadow:rgba(255,255,255,.07) 0 0 0 1px,rgba(0,0,0,.3) 0 2px 4px;
  --pop:#252525;--popsh:rgba(255,255,255,.08) 0 0 0 1px,rgba(0,0,0,.35) 0 3px 6px,rgba(0,0,0,.45) 0 9px 24px;
  --codebg:#222;--icode:rgba(135,131,120,.25);--icodec:#ff7369;--mark:rgba(255,212,0,.24);
  --c-backlog:#1e1e1e;--p-backlog:#373737;--d-backlog:#979a9b;--x-backlog:rgba(255,255,255,.86);
  --c-todo:#1a1f25;--p-todo:#1f3a52;--d-todo:#5e9fd0;--x-todo:#d3e6f5;--link:#5aa6e0;
  --c-done:#1a211c;--p-done:#243b2c;--d-done:#6aa37f;--x-done:#d0e8d7;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji";-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{width:16px;height:16px;flex:none;display:block}
::selection{background:rgba(35,131,226,.28)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--hov2);border-radius:10px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}

#app{display:flex;height:100%}
/* Sidebar */
#side{width:248px;flex:none;background:var(--side);display:flex;flex-direction:column;transition:margin-left .2s ease,transform .2s ease;box-shadow:inset -1px 0 0 var(--bd);user-select:none;z-index:30}
#app.side-closed #side{margin-left:-248px}
.ws{display:flex;align-items:center;gap:8px;padding:12px 10px 8px 14px;font-weight:600;font-size:14px}
.ws-logo{width:22px;height:22px;border-radius:5px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700}
.ws-name{flex:1}
.ibtn{width:28px;height:28px;border-radius:6px;display:inline-grid;place-items:center;color:var(--t2);flex:none}
.ibtn:hover{background:var(--hov2);color:var(--text)}
.sitem{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;margin:1px 6px;border-radius:6px;color:var(--t2);font-size:14px;text-align:left;width:calc(100% - 12px)}
.sitem:hover{background:var(--hov2);color:var(--text)}
.si{width:20px;display:grid;place-items:center}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--text)}
.search input::placeholder{color:var(--t2)}
.search:focus-within{background:var(--hov2)}
.slabel{font-size:12px;font-weight:600;color:var(--t3);padding:14px 16px 4px}
#nav{flex:1;overflow:auto;padding-bottom:8px}
.nav-item{display:flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 10px;margin:1px 6px;border-radius:6px;cursor:pointer;color:var(--t2);font-size:14px}
.nav-item:hover{background:var(--hov)}
.nav-item.active{background:var(--hov2);color:var(--text);font-weight:500}
.nav-ic{width:20px;text-align:center;font-size:15px;line-height:1}
.nav-tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-del{opacity:0;width:24px;height:24px;border-radius:4px;display:grid;place-items:center;color:var(--t3)}
.nav-item:hover .nav-del{opacity:1}
.nav-del:hover{background:var(--hov2);color:var(--red)}
.nav-empty{padding:6px 16px;color:var(--t3);font-size:13px;position:relative}
.nav-item{position:relative}
.nav-item.drop-before::before,.nav-item.drop-after::after,.nav-empty.drop-after::after{content:"";position:absolute;left:10px;right:10px;height:2px;border-radius:2px;background:var(--acc);pointer-events:none;z-index:2}
.nav-item.drop-before::before{top:-2px}.nav-item.drop-after::after,.nav-empty.drop-after::after{bottom:-2px}
.nav-item.folder{color:var(--text);font-weight:500}
.chev{width:16px;height:18px;margin-left:-6px;display:grid;place-items:center;color:var(--t3);transition:transform .15s ease;flex:none}
.chev svg{width:12px;height:12px}
.nav-item.folder.open .chev{transform:rotate(90deg)}
.f-cnt{font-size:12px;font-weight:400;color:var(--t3);min-width:18px;text-align:right;padding-right:5px}
.nav-act{display:none;width:24px;height:24px;border-radius:4px;place-items:center;color:var(--t3);flex:none}
.nav-item:hover .nav-act{display:grid}
.nav-item.folder:hover .f-cnt{display:none}
.nav-act:hover{background:var(--hov2);color:var(--text)}
.f-children{position:relative}
.f-children::before{content:"";position:absolute;left:25px;top:2px;bottom:2px;width:1px;background:var(--bd)}
.nav-item.sub{padding-left:34px}
.nav-empty.sub{padding:4px 16px 6px 40px;font-size:12px}
.nav-item.dragging,.f-children.dragging{opacity:.4}
.nav-item.drop-in{background:rgba(35,131,226,.14);box-shadow:inset 0 0 0 1.5px rgba(35,131,226,.55)}
#nav.drop-root{box-shadow:inset 0 0 0 1.5px rgba(35,131,226,.35);border-radius:8px}
.rename{flex:1;min-width:0;font:inherit;font-weight:500;color:var(--text);background:var(--bg);border:0;outline:0;border-radius:4px;padding:2px 5px;box-shadow:0 0 0 2px rgba(35,131,226,.55)}
.crumb-f{color:var(--t2);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.crumb-sep{color:var(--t3)}
.sfoot{padding:6px 0 10px;box-shadow:inset 0 1px 0 var(--bd)}
.scrim{display:none}

/* Main */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px}
#app:not(.side-closed) #openSide{display:none}
#crumb{display:flex;align-items:center;gap:6px;min-width:0;padding:2px 6px;font-size:14px}
#crumb span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{flex:1}
#status{font-size:12px;color:var(--t3);white-space:nowrap;margin-right:4px}
#scroll{flex:1;overflow:auto}
.page{max-width:900px;margin:0 auto;padding:0 96px}
.page.wide{max-width:none;padding:0 40px}
.page-head{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;align-items:center;padding:18px 0 12px;margin-bottom:14px;box-shadow:inset 0 -1px 0 var(--bd)}
.picon{grid-row:1/3;font-size:30px;line-height:1;width:46px;height:46px;border-radius:8px;display:grid;place-items:center;margin-left:-6px}
.picon:hover{background:var(--hov)}
.ptitle{font-size:28px;font-weight:700;line-height:1.25;outline:none;margin:0;word-break:break-word;white-space:pre-wrap}
.ptitle:empty::before{content:attr(data-ph);color:var(--ph)}
.pmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12px;color:var(--t3);margin-top:2px}
.prog{width:90px;height:5px;border-radius:3px;background:var(--hov2);overflow:hidden;display:inline-block}
.prog i{display:block;height:100%;background:var(--d-done);transition:width .3s}
.empty{padding:120px 20px;text-align:center;color:var(--t2)}
.empty h2{color:var(--text);font-size:22px;margin:0 0 6px}
.empty .row{display:flex;gap:8px;justify-content:center;margin-top:16px}
.btn{height:32px;padding:0 12px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--bd);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hov)}

/* Editor */
.editor{counter-reset:num;font-size:16px;line-height:1.5}
.block{position:relative;display:flex;align-items:flex-start;margin:1px 0}
.block:not([data-type=number]){counter-reset:num}
.block[data-type=number]{counter-increment:num}
.grip{position:absolute;left:-26px;top:3px;width:20px;height:24px;border-radius:4px;display:grid;place-items:center;color:var(--t3);opacity:0;cursor:grab;transition:opacity .1s}
.grip svg{width:10px;height:16px}
.block:hover>.grip{opacity:1}
.grip:hover{background:var(--hov2)}
.bc{flex:1;min-width:0;outline:none;padding:3px 2px;white-space:pre-wrap;word-break:break-word}
.bc:empty::before{content:attr(data-ph);color:var(--ph);pointer-events:none}
.block[data-type=p] .bc:empty:not(:focus)::before{content:""}
.block[data-type=h1]{margin-top:1.3em}.block[data-type=h1] .bc{font-size:1.875em;font-weight:600;line-height:1.3}.block[data-type=h1] .grip{top:11px}
.block[data-type=h2]{margin-top:1.1em}.block[data-type=h2] .bc{font-size:1.5em;font-weight:600;line-height:1.3}.block[data-type=h2] .grip{top:7px}
.block[data-type=h3]{margin-top:.8em}.block[data-type=h3] .bc{font-size:1.25em;font-weight:600;line-height:1.3}.block[data-type=h3] .grip{top:4px}
.editor>.block:first-child{margin-top:0}
.pre{min-width:24px;height:30px;display:flex;align-items:center;justify-content:center;flex:none;padding:0 2px}
.block[data-type=bullet] .pre::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.block[data-type=number] .pre::before{content:counter(num) "."}
.chk{width:16px;height:16px;margin:7px 8px 0 4px;border:1.5px solid var(--t2);border-radius:3px;cursor:pointer;flex:none;display:grid;place-items:center;transition:background .12s}
.chk svg{width:12px;height:12px;color:#fff;opacity:0}
.chk.on{background:var(--acc);border-color:var(--acc)}.chk.on svg{opacity:1}
.block.checked .bc{text-decoration:line-through;color:var(--t3)}
.block[data-type=quote] .bc{border-left:3px solid currentColor;padding-left:14px;margin:4px 0;font-size:1.1em}
.block[data-type=code] .bc{font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--codebg);padding:16px 20px;border-radius:6px;margin:4px 0;tab-size:2}
.block[data-type=code] .grip{top:17px}
.block[data-type=divider]{padding:6px 0}
.block[data-type=image]{margin:6px 0;outline:none}
.img-box{position:relative;width:100%;border-radius:6px;overflow:hidden;background:var(--hov);cursor:zoom-in;min-height:60px}
.block.ready .img-box{background:none;min-height:0}
.img-box img{display:block;width:100%;height:auto;border-radius:6px}
.block.loading .img-box img,.block.missing .img-box img{display:none}
.img-msg{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:10px;text-align:center;font-size:13px;color:var(--t3)}
.block.loading .img-msg,.block.missing .img-msg{display:flex}
.block.loading .img-box{animation:pulse 1.2s infinite}
.block[data-type=image]:focus .img-box{box-shadow:0 0 0 3px rgba(35,131,226,.55)}
.block[data-type=image] .grip{top:4px}
.editor.drop-files{box-shadow:inset 0 0 0 2px rgba(35,131,226,.35);border-radius:8px}
.lightbox{position:fixed;inset:0;z-index:95;background:rgba(10,10,10,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px 16px calc(16px + env(safe-area-inset-bottom))}
.lightbox img{max-width:100%;max-height:calc(100% - 64px);object-fit:contain;border-radius:6px;cursor:zoom-out}
.lb-bar{display:flex;gap:8px}
.lb-bar button{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;font-size:14px}
.lb-bar button:hover{background:rgba(255,255,255,.2)}
.lb-bar button.danger:hover{background:rgba(235,87,87,.5)}
.block[data-type=divider] .grip{top:1px}
.hr{flex:1;height:1px;background:var(--bd);margin:6px 0}
.bc code{background:var(--icode);color:var(--icodec);border-radius:4px;padding:.15em .35em;font:85% ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bc mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.bc a[href],.ttext a[href]{color:var(--link);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--link) 45%,transparent);text-underline-offset:3px;cursor:pointer;word-break:break-all}
.bc a[href]:hover,.ttext a[href]:hover{text-decoration-color:var(--link)}
.lp{display:flex;flex-direction:column;padding:4px;font-size:13px;max-width:calc(100vw - 16px)}
.lp-view{display:flex;align-items:center;gap:2px}
.lp-url{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-radius:6px;color:var(--t2);text-decoration:none;min-width:0;max-width:240px}
.lp-url span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-url:hover{background:var(--hov2);color:var(--text)}
.lp .sep{width:1px;height:18px;background:var(--bd);margin:0 3px;flex:none}
.lp-btn{display:flex;align-items:center;gap:5px;height:30px;padding:0 8px;border-radius:6px;white-space:nowrap}
.lp-btn svg{width:15px;height:15px}
.lp-btn:hover{background:var(--hov2)}
.lp-btn.danger:hover{color:var(--red)}
.lp-edit{display:none;flex-direction:column;gap:10px;padding:10px;width:340px;max-width:calc(100vw - 24px)}
.lp.editing .lp-view{display:none}.lp.editing .lp-edit{display:flex}
.lp-edit label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--t2)}
.lp-edit input{height:34px;border:0;border-radius:6px;padding:0 10px;font:inherit;font-size:14px;color:var(--text);background:var(--hov);box-shadow:inset 0 0 0 1px var(--bd);outline:0}
.lp-edit input:focus{box-shadow:inset 0 0 0 2px rgba(35,131,226,.6)}
.lp-row{display:flex;justify-content:flex-end;gap:6px}
.btn.primary{background:var(--acc);color:#fff;box-shadow:none}.btn.primary:hover{background:#1a6fc4}
.block.dragging{opacity:.35}
.block.drop-before::after,.block.drop-after::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--acc);opacity:.55;border-radius:2px}
.block.drop-before::after{top:-2px}.block.drop-after::after{bottom:-2px}
.ed-tail{height:30vh;cursor:text}

/* Board */
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding:4px 2px 16px}
.col{flex:1 1 0;min-width:270px;max-width:420px;border-radius:10px;padding:8px;display:flex;flex-direction:column;max-height:var(--colmax,calc(100vh - 120px))}
.col-head{flex:none}
.col-backlog{background:var(--c-backlog)}.col-todo{background:var(--c-todo)}.col-done{background:var(--c-done)}
.col-head{display:flex;align-items:center;gap:8px;padding:2px 2px 10px 4px;min-height:34px}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px 0 8px;border-radius:12px;font-size:14px;font-weight:500}
.pill i{width:8px;height:8px;border-radius:50%}
.col-backlog .pill{background:var(--p-backlog);color:var(--x-backlog)}.col-backlog .pill i{background:var(--d-backlog)}
.col-todo .pill{background:var(--p-todo);color:var(--x-todo)}.col-todo .pill i{background:var(--d-todo)}
.col-done .pill{background:var(--p-done);color:var(--x-done)}.col-done .pill i{background:var(--d-done)}
.cnt{color:var(--t3);font-size:14px}
.col-head .ibtn{opacity:.0;width:26px;height:26px}
.col:hover .col-head .ibtn{opacity:1}
.cards{display:flex;flex-direction:column;gap:8px;min-height:6px;flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;margin:0 -6px;padding:2px 6px 4px;scrollbar-width:thin}
.cards>*{flex:none}
.cards.fade-b{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent)}
.cards.fade-t{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 28px);mask-image:linear-gradient(to bottom,transparent,#000 28px)}
.cards.fade-t.fade-b{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 28px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to bottom,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
.card{position:relative;background:var(--card);border-radius:8px;box-shadow:var(--shadow);padding:10px 8px 8px 10px;display:grid;grid-template-columns:auto 1fr auto;column-gap:9px;align-items:start;cursor:grab;transition:opacity .22s,transform .22s,background .15s}
.card:hover{background:var(--cardh)}
.card.dragging{opacity:.35}
.card.leaving{opacity:0;transform:translateX(14px) scale(.98)}
.card.flash{animation:flash 1.4s ease}
@keyframes flash{0%,35%{box-shadow:0 0 0 2px var(--acc),var(--shadow)}100%{box-shadow:var(--shadow)}}
.tchk{width:17px;height:17px;margin-top:2px;border:1.5px solid var(--t2);border-radius:4px;display:grid;place-items:center;transition:background .15s,border-color .15s}
.tchk svg{width:12px;height:12px;color:#fff;opacity:0;transition:opacity .15s}
.tchk:hover{border-color:var(--acc)}
.tchk.on{background:var(--acc);border-color:var(--acc)}.tchk.on svg{opacity:1}
.ttext{font-size:14px;line-height:1.5;font-weight:500;outline:none;cursor:text;word-break:break-word;white-space:pre-wrap;min-height:21px}
.ttext:empty::before{content:attr(data-ph);color:var(--ph);font-weight:400}
.card.is-done .ttext{text-decoration:line-through;color:var(--t3)}
.tdel{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;color:var(--t3);opacity:0}
.tdel svg{width:14px;height:14px}
.card:hover .tdel{opacity:1}
.tdel:hover{background:var(--hov2);color:var(--red)}
.tmeta{grid-column:2/4;display:flex;align-items:center;gap:5px;margin-top:5px;font-size:12px;color:var(--t3);cursor:pointer;width:fit-content;border-radius:4px;padding:1px 4px 1px 0}
.tmeta svg{width:13px;height:13px}
.tmeta:hover{color:var(--t2)}
.thist{grid-column:2/4;display:none;margin-top:6px;padding-top:6px;box-shadow:inset 0 1px 0 var(--bd);font-size:12px;color:var(--t2)}
.card.show-hist .thist{display:block}
.thist div{display:flex;justify-content:space-between;gap:10px;padding:1px 0}
.thist span{color:var(--t3);white-space:nowrap}
.add-card{flex:none;display:flex;align-items:center;gap:6px;width:100%;height:32px;padding:0 8px;margin-top:6px;border-radius:6px;color:var(--t3);font-size:14px}
.add-card:hover{background:var(--hov2);color:var(--t2)}
.drop-line{height:2px;margin:-5px 2px;background:var(--acc);border-radius:2px;opacity:.7}

/* Popovers */
.pop{position:fixed;z-index:50;background:var(--pop);box-shadow:var(--popsh);border-radius:10px}
.menu{padding:6px;min-width:220px;max-width:320px;max-height:360px;overflow:auto;font-size:14px}
.mi{display:flex;align-items:center;gap:10px;padding:4px 8px;min-height:30px;border-radius:6px;cursor:pointer}
.mi.on{background:var(--hov2)}
.mi.danger{color:var(--red)}
.mi-ic{width:20px;display:grid;place-items:center;flex:none;color:var(--t2);font-size:13px}
.mi.danger .mi-ic{color:var(--red)}
.mi-tx{display:flex;flex-direction:column;min-width:0}
.mi-tx small{color:var(--t3);font-size:12px}
.menu.big .mi-ic{width:40px;height:40px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--bd);background:var(--bg);font-weight:600;font-size:15px;color:var(--text)}
.mi-head{padding:8px 8px 4px;font-size:12px;font-weight:500;color:var(--t3)}
.mi-empty{padding:8px;color:var(--t3)}
.emo{display:grid;grid-template-columns:repeat(8,34px);gap:2px;padding:8px}
.emo button{height:34px;border-radius:6px;font-size:20px}
.emo button:hover{background:var(--hov2)}
.fmt{display:flex;align-items:center;padding:3px;border-radius:8px}
.fmt button{height:28px;min-width:30px;padding:0 7px;border-radius:5px;display:grid;place-items:center;font-size:14px}
.fmt button:hover{background:var(--hov2)}
.fmt .sep{width:1px;height:18px;background:var(--bd);margin:0 3px}
.fmt .hl{background:var(--mark);padding:0 3px;border-radius:3px}

/* sync pill */
.sync{display:none;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:13px;font-size:12px;color:var(--t2);white-space:nowrap}
.sync:hover{background:var(--hov2)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--t3);flex:none}
.sync.on{display:inline-flex}
.sync.ok i{background:#4dab6f}.sync.busy i{background:var(--acc);animation:pulse 1s infinite}.sync.warn i{background:#e0983a}.sync.err i{background:var(--red)}.sync.err{color:var(--red)}
@keyframes pulse{50%{opacity:.3}}
/* overlay dialog */
.ovl{position:fixed;inset:0;z-index:80;background:rgba(15,15,15,.45);display:grid;place-items:center;padding:20px}
.dlg{background:var(--pop);color:var(--text);box-shadow:var(--popsh);border-radius:14px;width:100%;max-width:400px;padding:22px 22px 18px}
.dlg h3{margin:0 0 6px;font-size:18px}
.dlg p{margin:6px 0;color:var(--t2);font-size:14px}
.dlg .ic{font-size:34px;line-height:1;margin-bottom:10px}
.dlg .fld{display:flex;flex-direction:column;gap:5px;margin-top:14px;font-size:13px;color:var(--t2)}
.dlg .fld span{display:flex;justify-content:space-between;align-items:baseline}
.dlg .fld a{color:var(--acc);text-decoration:none;font-weight:500}
.dlg input{width:100%;height:42px;border:0;border-radius:9px;padding:0 12px;font:15px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);background:var(--hov);box-shadow:inset 0 0 0 1px var(--bd);outline:0}
.dlg .hint{font-size:12.5px;margin-top:12px}
.dlg .warn-msg{color:#c77d1a;font-size:13.5px}
.dlg .btn:disabled{opacity:.55;pointer-events:none}
.sync.off{color:var(--acc);box-shadow:inset 0 0 0 1px rgba(35,131,226,.35)}.sync.off i{display:none}
.dlg input:focus{box-shadow:inset 0 0 0 2px rgba(35,131,226,.6)}
.dlg .err{color:var(--red);min-height:20px;font-size:13px}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.dlg .btn{height:38px;padding:0 14px}
.dlg ol{margin:8px 0;padding-left:20px;color:var(--t2);font-size:14px}.dlg li{margin:5px 0}
.share-ic{display:inline-block;vertical-align:-3px}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:90;background:#2f2f2f;color:#fff;font-size:14px;padding:9px 14px;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:opacity .2s,transform .2s;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:#7cc0ff;font-weight:600}
/* mobile board tabs + card menu */
.mtabs{display:none}
.tmore{display:none;width:26px;height:26px;border-radius:5px;place-items:center;color:var(--t3)}
.tmore:active{background:var(--hov2)}
/* Highlight today */
.today-item{margin:1px 6px 4px;color:var(--text);font-weight:500}
.today-item .f-cnt{font-weight:500}
.today-item.all-done .f-cnt{color:#4dab6f}
.picon.static,.picon.static:hover{background:none;cursor:default}
.today-intro{max-width:760px;margin:4px 0 10px}
.today-intro h3{font-size:18px;margin:0 0 4px}
.today-intro p{margin:0;color:var(--t2);font-size:14px}
.today-list{display:flex;flex-direction:column;gap:6px;max-width:760px}
.trow{display:grid;grid-template-columns:auto 1fr auto;column-gap:10px;align-items:start;padding:10px 6px 10px 10px;border-radius:9px;background:var(--card);box-shadow:var(--shadow);transition:opacity .2s}
.trow .tchk{margin-top:2px}
.trow-body{min-width:0}
.trow-text{font-size:15px;font-weight:500;line-height:1.45;word-break:break-word}
.trow-text a[href]{color:var(--link);text-decoration:underline;text-underline-offset:3px;word-break:break-all}
.trow.is-done .trow-text{text-decoration:line-through;color:var(--t3)}
.trow-src{display:inline-flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:4px;font-size:12px;color:var(--t3);border-radius:4px;text-align:left}
.trow-src:hover .nm{text-decoration:underline;color:var(--t2)}
.trow-src .dot{opacity:.6}
.cl{font-size:11px;line-height:18px;padding:0 7px;border-radius:9px;white-space:nowrap}
.cl-backlog{background:var(--p-backlog);color:var(--x-backlog)}.cl-todo{background:var(--p-todo);color:var(--x-todo)}.cl-done{background:var(--p-done);color:var(--x-done)}
.trow-rm{width:26px;height:26px;border-radius:5px;display:grid;place-items:center;color:var(--t3);opacity:0}
.trow:hover .trow-rm{opacity:1}
.trow-rm:hover{background:var(--hov2);color:var(--text)}
.trow-rm svg{width:14px;height:14px}
.today-done{margin:14px 2px 0;color:var(--t2);font-size:14px}
.today-add{max-width:760px;margin-top:10px}
.picker{max-width:760px;display:flex;flex-direction:column;gap:10px}
.pk-q{height:38px;border:0;border-radius:8px;padding:0 12px;font:inherit;font-size:15px;color:var(--text);background:var(--hov);box-shadow:inset 0 0 0 1px var(--bd);outline:0}
.pk-q:focus{box-shadow:inset 0 0 0 2px rgba(35,131,226,.55)}
.pk-carry{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;background:rgba(35,131,226,.09);color:var(--acc);font-size:14px;text-align:left}
.pk-list{display:flex;flex-direction:column}
.pk-g{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--t2);padding:12px 6px 4px}
.pk-g .n{font-weight:400;color:var(--t3)}
.pk-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;text-align:left;padding:8px;border-radius:7px;font-size:14.5px;line-height:1.45}
.pk-row:hover{background:var(--hov)}
.pk-row.on{background:rgba(35,131,226,.09)}
.pk-row .tchk{margin-top:1px}
.pk-tx{word-break:break-word}
.pk-empty{padding:16px 6px;color:var(--t3);font-size:14px}
.pk-foot{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:10px 0 12px;background:var(--bg);box-shadow:0 -1px 0 var(--bd)}
.pk-cnt{margin-right:auto;color:var(--t2);font-size:13.5px}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.primary{background:var(--acc);color:#fff;box-shadow:none}
.dlg.dlg-picker{max-width:560px;padding-bottom:6px}
.dlg-picker .picker{margin-top:10px}
.dlg-picker .pk-list{max-height:52vh;overflow:auto;overscroll-behavior:contain}
.dlg-picker .pk-foot{background:var(--pop)}
.dlg .pk-q{height:38px;font:inherit;font-size:15px;border-radius:8px}
.pk-foot .btn{white-space:nowrap;flex:none}
.pk-cnt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:900px){.page{padding:0 48px}.page.wide{padding:0 32px}}
@media (max-width:760px){
  #side{position:fixed;top:0;bottom:0;left:0;box-shadow:rgba(15,15,15,.2) 0 0 24px}
  #app.side-closed #side{margin-left:0;transform:translateX(-105%)}
  #app:not(.side-closed) .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:25}
  .page,.page.wide{padding:0 20px}
  .page-head{padding-top:10px}
  .ptitle{font-size:24px}
  .grip{display:none}
  .col{min-width:260px}
  .tdel,.col-head .ibtn{opacity:1}
  .nav-act{display:grid}.nav-item.folder .f-cnt{display:none}
  .nav-del{display:none}
  .trow-rm{opacity:1}
  .dlg-picker .pk-list{max-height:56vh}
  .dlg .pk-q,.pk-q{font-size:16px}
  .dlg.dlg-picker{padding:18px 16px 4px}
  #top{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
  #scroll{padding-bottom:env(safe-area-inset-bottom)}
  .sfoot{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  #side{padding-top:env(safe-area-inset-top)}
  #q,.rename,.lp-edit input{font-size:16px}
  .ttext,.editor{font-size:16px}
  .sitem,.nav-item{height:36px}
  #status{display:none}
  .crumb-f,.crumb-sep{display:none}
  .mtabs{display:flex;gap:4px;padding:3px;margin:2px 0 10px;border-radius:10px;background:var(--hov)}
  .mtabs button{flex:1;height:34px;border-radius:8px;font-size:14px;font-weight:500;color:var(--t2);display:flex;align-items:center;justify-content:center;gap:6px}
  .mtabs button.on{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .mtabs .n{font-size:12px;color:var(--t3);font-weight:400}
  .board{display:block;overflow:visible;padding-bottom:8px}
  .board .col{display:none;max-width:none;min-width:0}
  .board[data-m=backlog] .col-backlog,.board[data-m=todo] .col-todo,.board[data-m=done] .col-done{display:flex}
  .col-head{display:none}
  .card{grid-template-columns:auto 1fr auto;padding:12px 8px 10px 12px}
  .tchk{width:20px;height:20px;margin-top:1px}
  .tdel{display:none}
  .tmore{display:grid}
  .lp-btn span{display:none}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="ws"><div class="ws-logo">N</div><div class="ws-name">NoteLite</div><button class="ibtn" id="closeSide" title="Thu gọn thanh bên (Ctrl+\)"></button></div>
    <label class="sitem search"><span class="si" data-ic="search"></span><input id="q" placeholder="Tìm kiếm" autocomplete="off"></label>
    <button class="sitem" id="newNote"><span class="si" data-ic="doc"></span>Ghi chú mới</button>
    <button class="sitem" id="newBoard"><span class="si" data-ic="board"></span>Todo list mới</button>
    <button class="sitem" id="newFolder"><span class="si" data-ic="folder"></span>Thư mục mới</button>
    <div class="slabel">Trang</div>
    <div class="nav-item today-item" id="todayNav" title="Chọn việc làm hôm nay từ tất cả todo list"><span class="nav-ic">☀️</span><span class="nav-tt">Highlight today</span><span class="f-cnt"></span></div>
    <nav id="nav"></nav>
    <div class="sfoot">
      <button class="sitem" id="exportBtn" title="Tải toàn bộ dữ liệu về máy để sao lưu"><span class="si" data-ic="down"></span>Xuất dữ liệu (.json)</button>
      <button class="sitem" id="importBtn" title="Nhập lại từ file sao lưu .json"><span class="si" data-ic="up"></span>Nhập dữ liệu</button>
      <button class="sitem" id="themeBtn"><span class="si" data-ic="theme"></span><span>Giao diện: <span id="themeLbl"></span></span></button>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main id="main">
    <header id="top">
      <button class="ibtn" id="openSide" title="Mở thanh bên (Ctrl+\)"></button>
      <div id="crumb"></div>
      <div class="sp"></div>
      <span id="status"></span>
      <button class="sync" id="syncBtn"><i></i><span id="syncLbl"></span></button>
      <button class="ibtn" id="moreBtn" title="Tùy chọn trang"></button>
    </header>
    <div id="scroll"><div id="page" class="page"></div></div>
  </main>
</div>
<div id="menu" class="pop menu" hidden></div>
<div id="toast"></div>
<div id="fmt" class="pop fmt" hidden>
  <button data-cmd="bold" title="In đậm (Ctrl/⌘+B)"><b>B</b></button>
  <button data-cmd="italic" title="In nghiêng (Ctrl/⌘+I)"><i style="font-family:Georgia,serif">i</i></button>
  <button data-cmd="underline" title="Gạch chân (Ctrl/⌘+U)"><u>U</u></button>
  <button data-cmd="strikeThrough" title="Gạch ngang"><s>S</s></button>
  <span class="sep"></span>
  <button data-cmd="code" title="Code">&lt;/&gt;</button>
  <button data-cmd="mark" title="Highlight"><span class="hl">A</span></button>
  <button data-cmd="link" title="Chèn link (Ctrl/⌘+click để mở)" data-ic="link"></button>
</div>

<script>

      if (wait > 0) { pending = true; syncTimer = setTimeout(syncNow, wait + 50); setSync('ok'); return; }
      lastWriteAt = Date.now();
      const pr = await gh('PATCH', '/gists/' + SM.gist, { files: { [GIST_FILE]: { content: await seal(merged) } } });
      checkResp(pr);
      const pj = await pr.json(), hist = (pj.history || []).map(x => x.version), nver = hist[0] || verOf(pj);
      /* someone else uploaded between our read and our write → their version is in the Gist history: merge it back in */
      const at = hist.indexOf(rver), between = at > 1 ? hist.slice(1, at) : [];
      if (!between.length) { finishSync(nver, '', merged); return; }
      let acc = emptyDoc();
      for (const v of between) {
        const rr = await gh('GET', `/gists/${SM.gist}/${v}`);
        if (rr.ok) acc = mergeDocs(acc, await docFrom(await rr.json()), {});
      }
      applyMerged(mergeDocs(docOf(S), acc, prevBase));
      /* both our upload and theirs are now on GitHub → count them as seen, so the next round can't raise a second conflict copy */
      [tsMap(merged), tsMap(acc)].forEach(m => { for (const id in m) SM.base[id] = Math.max(SM.base[id] || 0, m[id]); });

async function connect(token, pass, progress) {

  const old = { ...SM };
  SM.token = token;
  try {
    let r = await gh('GET', '/user');
    if (r.status === 401) throw new Error('Token không đúng hoặc đã hết hạn.');
    if (!r.ok) throw new Error('GitHub trả về lỗi ' + r.status + '. Thử lại sau.');

    SM.login = (await r.json()).login || '';

    let found = null;

      const lr = await gh('GET', `/gists?per_page=100&page=${page}`);

      const list = await lr.json();
      found = list.filter(g => g.files && g.files[GIST_FILE]).sort((a, b) => (b.updated_at > a.updated_at ? 1 : -1))[0] || null;

    }
    if (found) {
      progress('Đang giải mã…');
      const gr = await gh('GET', '/gists/' + found.id); checkResp(gr);
      const gj = await gr.json(), env = JSON.parse(await fileText(gj));
      const key = await deriveKey(pass, env.salt, env.iter);
      try { await unseal(JSON.stringify(env), key); }
      catch (_) { throw new Error('Sai mật khẩu đồng bộ. Dữ liệu trên GitHub đã được mã hóa bằng mật khẩu khác (mật khẩu bạn đặt lần đầu).'); }

      progress('Đang gộp dữ liệu…');
      await syncNow(true);
      if (syncState !== 'ok') throw new Error('Kết nối được nhưng chưa đồng bộ xong. Kiểm tra mạng rồi bấm lại.');
      toast('Đã bật đồng bộ ✓ Dữ liệu từ các máy khác đã được gộp vào.');
    } else {
      progress('Đang tạo nơi lưu trữ mã hóa trên GitHub…');
      const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
      CK = await deriveKey(pass, salt, KDF_ITER);
      Object.assign(SM, { salt, iter: KDF_ITER, key: b64(await crypto.subtle.exportKey('raw', CK)) });
      const cr = await gh('POST', '/gists', { description: GIST_DESC, public: false, files: { [GIST_FILE]: { content: await seal(docOf(S)) } } });
      if (!cr.ok) throw new Error('Không tạo được Gist (' + cr.status + '). Token cần quyền gist.');
      const cj = await cr.json();
      Object.assign(SM, { gist: cj.id, skipSetup: false });
      finishSync(verOf(cj), '', docOf(S));

/* ---------- Images in notes ----------
   Pixels never go into the note data (browser storage is small and the note file is re-uploaded on every sync).
   • On this device: compressed image in IndexedDB, key = image id.  Note block = { type:'image', img:id }.
   • Sync: each image is encrypted with the same key as the notes and stored once in its own secret Gist;
     S.imgs[id] = { w, h, g: gistId } travels with the notes. Other devices download an image only when it's shown. */
const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('notelite', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('img');
    r.onsuccess = () => res(r.result);
    r.onerror = () => { dbp = null; rej(r.error); };
  }));
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction('img', mode), rq = fn(tx.objectStore('img'));
      tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  };
  return { get: k => run('readonly', s => s.get(k)), put: (k, v) => run('readwrite', s => s.put(v, k)) };
})();
const IMG_MAX = 2000;                                   // longest side after resize (sharp enough for screenshots)
const IMGURL = new Map(), IMGLOAD = new Map();
let persistAsked = false;

async function decodeImage(file) {
  if (window.createImageBitmap) { try { return await createImageBitmap(file); } catch (_) {} }
  const u = URL.createObjectURL(file), im = new Image();
  im.src = u;
  try { await im.decode(); } finally { setTimeout(() => URL.revokeObjectURL(u), 2000); }
  return im;
}
/* resize + compress: WebP where the browser can make it, else JPEG; keeps small originals (and GIF animations) untouched */
async function prepImage(file) {
  const src = await decodeImage(file);
  const w0 = src.width || src.naturalWidth, h0 = src.height || src.naturalHeight;
  if (!w0 || !h0) throw new Error('decode');
  if (file.type === 'image/gif' && file.size <= 3e6) return { blob: file, w: w0, h: h0 };
  const k = Math.min(1, IMG_MAX / Math.max(w0, h0)), W = Math.max(1, Math.round(w0 * k)), H = Math.max(1, Math.round(h0 * k));
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(src, 0, 0, W, H);
  if (src.close) src.close();
  const toBlob = (t, q) => new Promise(r => cv.toBlob(r, t, q));
  let out = await toBlob('image/webp', 0.86);
  if (!out || out.type !== 'image/webp') {
    g.globalCompositeOperation = 'destination-over'; g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);   // JPEG has no transparency
    out = await toBlob('image/jpeg', 0.86);
  }
  if (!out || (k === 1 && file.size <= out.size && file.size < 1.5e6 && /^image\/(png|jpeg|webp)$/.test(file.type))) out = file;
  return { blob: out, w: W, h: H };
}
function usedImgIds() {            // images still placed in some note (deleted ones are not uploaded / exported)
  const u = new Set();
  Object.values(S.pages).forEach(p => (p.type === 'note' ? p.blocks || [] : []).forEach(b => { if (b.type === 'image' && b.img) u.add(b.img); }));
  return u;
}
function imgMeta(id) { return (S.imgs && S.imgs[id]) || null; }
async function imageUrl(id) {
  if (IMGURL.has(id)) return IMGURL.get(id);
  if (IMGLOAD.has(id)) return IMGLOAD.get(id);
  const p = (async () => {
    let rec = await IDB.get(id).catch(() => null);
    if (!rec) rec = await downloadImage(id);
    const url = URL.createObjectURL(new Blob([rec.buf], { type: rec.type }));
    IMGURL.set(id, url);
    return url;
  })();
  IMGLOAD.set(id, p);
  try { return await p; } finally { IMGLOAD.delete(id); }
}
async function downloadImage(id) {
  const m = imgMeta(id);
  if (!m || !m.g) throw new Error('pending');                   // not uploaded yet by the device that has it
  if (!configured() || !CK) throw new Error('nosync');
  const r = await gh('GET', '/gists/' + m.g);
  if (!r.ok) throw new Error('http ' + r.status);
  const j = await r.json(), f = Object.values(j.files || {})[0];
  if (!f) throw new Error('empty');
  const text = f.truncated ? await (await fetch(f.raw_url, { cache: 'no-store' })).text() : f.content;
  const e = JSON.parse(text);
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(e.iv) }, CK, unb64(e.ct));
  const rec = { buf, type: e.type || 'image/jpeg', w: m.w, h: m.h };
  await IDB.put(id, rec).catch(() => {});
  return rec;
}
async function sealImage(rec) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, CK, rec.buf);
  return JSON.stringify({ app: 'NoteLite', kind: 'image', v: 1, note: 'Ảnh NoteLite đã mã hóa (AES-256-GCM).', type: rec.type, iv: b64(iv), ct: b64(ct) });
}
let pumping = false;
async function pumpImages() {                                   // upload images that exist only on this device
  if (pumping || !configured() || !CK || !S.imgs) return;
  const used = usedImgIds(), todo = Object.keys(S.imgs).filter(id => !S.imgs[id].g && used.has(id));
  if (!todo.length) return;
  pumping = true;
  try {
    for (const id of todo) {
      const rec = await IDB.get(id).catch(() => null);
      if (!rec) continue;
      const r = await gh('POST', '/gists', { description: 'NoteLite · ảnh (đã mã hóa)', public: false, files: { 'notelite-image.enc.json': { content: await sealImage(rec) } } });
      if (!r.ok) break;
      const j = await r.json();
      S.imgs[id] = { ...S.imgs[id], g: j.id };
      save();
    }
  } catch (_) { /* offline: try again after the next sync */ }
  finally { pumping = false; }
}
function mergeImgs(a, b) {

  for (const k in (b || {})) if (!r[k] || (!r[k].g && b[k].g)) r[k] = b[k];

}

const isEmptyText = w => w && w.dataset.type === 'p' && bc(w) && !bc(w).textContent.trim();
/* insert images next to block `ref` ('after' | 'before' | 'replace' when ref is an empty line) */
async function insertImages(files, ref, mode) {
  files = files.filter(f => f && /^image\//.test(f.type));
  if (!files.length || !ED) return;
  if (!persistAsked && navigator.storage && navigator.storage.persist) { persistAsked = true; navigator.storage.persist().catch(() => {}); }
  const page = cur(), blocks = [];
  let anchor = ref;
  files.forEach((f, i) => {
    const nb = blockEl({ id: uid(), type: 'image', img: '' });
    nb.classList.add('loading'); $('.img-msg', nb).textContent = 'Đang xử lý ảnh…';
    if (i === 0 && mode === 'replace' && isEmptyText(ref)) ref.replaceWith(nb);
    else if (i === 0 && mode === 'before') ref.before(nb);
    else anchor.after(nb);
    anchor = nb; blocks.push([nb, f]);
  });
  let next = anchor.nextElementSibling;
  if (!next || !bc(next)) { next = newBlock('p'); anchor.after(next); }
  focusStart(bc(next));
  let failed = 0;
  for (const [nb, f] of blocks) {
    try {
      const r = await prepImage(f), buf = await r.blob.arrayBuffer(), id = uid();
      await IDB.put(id, { buf, type: r.blob.type || f.type, w: r.w, h: r.h });
      S.imgs = S.imgs || {};
      S.imgs[id] = { w: r.w, h: r.h, size: buf.byteLength, at: now() };
      IMGURL.set(id, URL.createObjectURL(r.blob));
      if (!nb.isConnected) continue;
      const fresh = blockEl({ id: nb.dataset.id, type: 'image', img: id });
      nb.replaceWith(fresh);
    } catch (e) { failed++; nb.remove(); }
  }
  if (cur() === page && ED) syncNote();
  if (failed) toast(failed === 1 ? 'Không đọc được ảnh này (định dạng không hỗ trợ).' : `Không đọc được ${failed} ảnh.`);
  pumpImages();
}

/* ---- task picker (inline when the day is empty, in a dialog when adding more) ---- */
function buildPicker(onDone, cta, onCancel) {
  const td = todayList(), already = new Set((td ? td.items : []).map(tkey));
  const sel = new Map();                          // key → {p, t}, in the order the user picks them
  const wrap = h('div', 'picker');
  const q = h('input', 'pk-q'); q.placeholder = 'Tìm task…'; q.type = 'search'; q.autocomplete = 'off';
  wrap.append(q);
  /* unfinished tasks from the last day that had a list */
  const old = S.today && S.today.date !== dayKey() ? todayItems(S.today).filter(x => x.t.col !== 'done' && !already.has(tkey(x.it))) : [];
  if (old.length) {
    const carry = h('button', 'pk-carry', `${IC.sync}<span>Chọn lại <b>${old.length}</b> việc chưa xong từ ${dayLabel(S.today.date)}</span>`);
    carry.onclick = () => { old.forEach(x => sel.set(tkey(x.it), x.it)); carry.remove(); draw(); };
    wrap.append(carry);
  }
  const list = h('div', 'pk-list');
  const foot = h('div', 'pk-foot');
  const cnt = h('span', 'pk-cnt');
  const go = h('button', 'btn primary', esc(cta));
  if (onCancel) { const c = h('button', 'btn', 'Hủy'); c.onclick = onCancel; foot.append(cnt, c, go); } else foot.append(cnt, go);
  wrap.append(list, foot);

    list.innerHTML = '';

    boardsInOrder().forEach(p => {
      const tasks = [...p.tasks.filter(t => t.col === 'todo'), ...p.tasks.filter(t => t.col === 'backlog')]
        .filter(t => t.text.trim() && !already.has(p.id + '/' + t.id) && (!qq || norm(t.text + ' ' + p.title).includes(qq)));
      if (!tasks.length) return;
      const g = h('div', 'pk-g', `<span>${esc(p.icon || '✅')}</span><span class="nm">${esc(p.title || 'Không có tiêu đề')}</span><span class="n">${tasks.length}</span>`);
      list.append(g);
      tasks.forEach(t => {
        const k = p.id + '/' + t.id, on = sel.has(k);
        const row = h('button', 'pk-row' + (on ? ' on' : ''), `<span class="tchk${on ? ' on' : ''}">${IC.check}</span><span class="pk-tx">${esc(t.text)}</span><span class="cl cl-${t.col}">${colName(t.col)}</span>`);
        row.onclick = () => {
          if (sel.has(k)) sel.delete(k); else sel.set(k, { p: p.id, t: t.id });
          const now_ = sel.has(k); row.classList.toggle('on', now_); $('.tchk', row).classList.toggle('on', now_); count();
        };

    });
    if (!shown) list.append(h('div', 'pk-empty', qq ? 'Không có task nào khớp.' : 'Chưa có task nào đang chờ trong các todo list (Backlog / To-do).'));
    count();
  }
  function count() { cnt.textContent = sel.size ? `Đã chọn ${sel.size}` : 'Chưa chọn việc nào'; go.disabled = !sel.size; }
  q.addEventListener('input', draw);
  go.onclick = () => { const td2 = todayList(); onDone([...(td2 ? td2.items : []), ...sel.values()]); };
  draw();
  return wrap;
}

  else return;
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', '');
  requestAnimationFrame(() => {
    it.classList.add('dragging');
    if (DRAGF) { const box = $(`.f-children[data-fid="${DRAGF}"]`, NAV); box && box.classList.add('dragging'); }
  });
});
NAV.addEventListener('dragover', e => {
  if (!DRAGP && !DRAGF) return;
  e.preventDefault(); clearNavDrop();
  const d = NAVDROP = navDropAt(e);
  if (!d) return;
  if (d.kind === 'into') d.el.classList.add('drop-in');
  else if (d.kind === 'root') NAV.classList.add('drop-root');
  else if (d.el && !(d.kind === 'page' && d.ref === DRAGP) && !(d.kind === 'folder' && d.fid === DRAGF)) d.el.classList.add(d.before ? 'drop-before' : 'drop-after');
});
NAV.addEventListener('dragleave', e => { if (!NAV.contains(e.relatedTarget)) { clearNavDrop(); NAVDROP = null; } });
NAV.addEventListener('drop', e => {
  if (!DRAGP && !DRAGF) return;
  e.preventDefault();
  const d = navDropAt(e), pid = DRAGP, fid = DRAGF;
  DRAGP = DRAGF = NAVDROP = null; clearNavDrop();
  if (!d) { renderNav(); return; }
  if (fid) placeFolder(fid, d.fid, d.before);
  else if (d.kind === 'page') placePage(pid, d.fid, d.ref, d.before);
  else if (d.kind === 'into') placePage(pid, d.fid, null);
  else placePage(pid, null, null);
});
NAV.addEventListener('dragend', () => { DRAGP = DRAGF = NAVDROP = null; clearNavDrop(); $$('.dragging', NAV).forEach(x => x.classList.remove('dragging')); });
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key === '\\') { e.preventDefault(); setSide(!sideOpen); }
  else if (mod && (e.key === 's' || e.key === 'S')) { e.preventDefault(); dirty = true; saveNow(); }
});
window.addEventListener('beforeunload', saveNow);
['dragover', 'drop'].forEach(ev => window.addEventListener(ev, e => { if (e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files') && !e.defaultPrevented) e.preventDefault(); }));
let fitT = null;
window.addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(fitBoard, 100); });
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
window.addEventListener('storage', e => {
  if (e.key !== KEY || !e.newValue) return;
  try { const a = S.active; S = fix(JSON.parse(e.newValue)); if (S.pages[a]) S.active = a; render(); } catch (_) {}
});

/* ---------- Init ---------- */
load();
sideOpen = innerWidth > 760 ? S.side !== false : false;
$('#app').classList.toggle('side-closed', !sideOpen);
render();
setStatus('Đã lưu');
initSync();
})();
</script>
</body>
